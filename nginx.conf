upstream fastapi_backend {
    server fastapi:8000;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS 反向代理
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    charset utf-8;
    client_max_body_size 10M;

    # auth_request 子请求返回 401 → 302 重定向到 /login
    error_page 401 =302 /login;

    # ===================================================================
    # 安全头
    # ===================================================================
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:;";

    # ===================================================================
    # 验证端点（internal：外部请求 Nginx 直接 404）
    # ===================================================================
    location = /api/auth/verify {
        internal;
        proxy_pass http://fastapi_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ===================================================================
    # 公开 API（无需登录）
    # ===================================================================
    location = /health {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }

    location ~ ^/api/(auth/(login|register|logout))$ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ===================================================================
    # 其余 API：透传到 FastAPI（后端读 Cookie 校验 JWT）
    # ===================================================================
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===================================================================
    # 静态资源：公开
    # ===================================================================
    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location /vite.svg {
        root /usr/share/nginx/html;
    }

    # ===================================================================
    # 登录页：公开
    # ===================================================================
    location = /login {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ===================================================================
    # SPA 入口：需要 JWT 验证
    # ===================================================================
    location / {
        auth_request /api/auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # ===================================================================
    # 自定义错误页
    # ===================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
